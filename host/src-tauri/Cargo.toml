[package]
name = "viex-host"
version = "0.1.0"
description = "VIEX Host — lets you watch this computer from your phone or laptop."
authors = ["VIEX contributors"]
edition = "2021"
license = "MIT"
default-run = "viex-host"

[lib]
# `_lib` keeps the library name distinct from the binary (Windows linker issue, see cargo#8519).
name = "viex_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-platform, multi-monitor aware screen capture.
xcap = "0.7"
# Not used directly: enables the `jpeg` feature on the `image` crate that xcap re-exports.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Stores the Relay password in the OS credential vault (Windows Credential Manager, macOS Keychain, ...).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
