name: Build & Release

# Every push to `main` builds the Windows/Linux/macOS Host installers, the Android Viewer
# APK and the Relay (backend) bundle, then publishes them as a new GitHub Release marked
# "Latest". The Host builds also produce signed auto-update artifacts + a `latest.json`
# manifest, which is what `host/src-tauri/tauri.conf.json`'s updater endpoint reads.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/website.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # Builds the Host installer for one OS/arch, plus (when TAURI_SIGNING_PRIVATE_KEY is set)
  # the signed auto-update artifact + its .sig next to it. Unsigned builds still produce a
  # normal installer — updates just won't be offered until the signing secret is added.
  host:
    name: Host (${{ matrix.name }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.VIEX_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.VIEX_UPDATER_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            updater_key: windows-x86_64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            updater_key: linux-x86_64
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            updater_key: darwin-aarch64
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            updater_key: darwin-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri
          key: ${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libayatana-appindicator3-dev libssl-dev \
            libpipewire-0.3-dev libspa-0.2-dev
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - name: Build Host (unsigned bundle, signed updater artifact)
        run: >
          npm run tauri build -w host --
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
      - name: Collect installer + updater artifact
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          target_dir="host/src-tauri/target/${{ matrix.target }}/release/bundle"

          # The renamed installer and its updater artifact always share one base name below,
          # so the release job can find "<name>" + "<name>.sig" without guessing Tauri's own
          # generated filename (which embeds the version and may differ run to run).
          case "${{ matrix.name }}" in
            windows-x64)
              cp "$target_dir"/nsis/*-setup.exe "out/VIEX-Host-Setup.exe"
              sig=$(find "$target_dir/nsis" -name "*-setup.exe.sig" | head -1 || true)
              updater_name="VIEX-Host-Setup.exe"
              ;;
            linux-x64)
              cp "$target_dir"/appimage/*.AppImage "out/VIEX-Host-x86_64.AppImage"
              cp "$target_dir"/deb/*.deb "out/VIEX-Host-amd64.deb" || true
              sig=$(find "$target_dir/appimage" -name "*.AppImage.sig" | head -1 || true)
              updater_name="VIEX-Host-x86_64.AppImage"
              ;;
            macos-arm64)
              cp "$target_dir"/dmg/*.dmg "out/VIEX-Host-arm64.dmg"
              sig=$(find "$target_dir/macos" -name "*.app.tar.gz.sig" | head -1 || true)
              [ -n "$sig" ] && cp "$(dirname "$sig")"/*.app.tar.gz "out/VIEX-Host-arm64.app.tar.gz" || true
              updater_name="VIEX-Host-arm64.app.tar.gz"
              ;;
            macos-x64)
              cp "$target_dir"/dmg/*.dmg "out/VIEX-Host-x64.dmg"
              sig=$(find "$target_dir/macos" -name "*.app.tar.gz.sig" | head -1 || true)
              [ -n "$sig" ] && cp "$(dirname "$sig")"/*.app.tar.gz "out/VIEX-Host-x64.app.tar.gz" || true
              updater_name="VIEX-Host-x64.app.tar.gz"
              ;;
          esac

          if [ -n "${sig:-}" ] && [ -f "$sig" ]; then
            cp "$sig" "out/${updater_name}.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android Viewer (.apk)
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VIEX_VERSION: ${{ needs.version.outputs.version }}
      VIEX_VERSION_CODE: ${{ github.run_number }}
      # Optional: set these repository secrets to sign with your own key instead of the community keystore.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build -w viewer
      - name: Generate the Android project
        working-directory: viewer
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Use custom signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VIEX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VIEX_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VIEX_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "VIEX_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: viewer/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect
        run: |
          mkdir out
          cp viewer/android/app/build/outputs/apk/release/app-release.apk out/VIEX-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/VIEX-Viewer.apk
          if-no-files-found: error

  relay:
    name: Relay bundle (.zip)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w viewer
        env:
          VIEX_VERSION: ${{ needs.version.outputs.version }}
      - name: Package
        run: |
          mkdir -p pkg/viex-relay out
          cp -r relay/src pkg/viex-relay/src
          cp relay/package.json relay/.env.example pkg/viex-relay/
          cp -r viewer/dist pkg/viex-relay/public
          cat > pkg/viex-relay/README.txt <<'EOF'
          VIEX Relay (backend) + web viewer
          ---------------------------------
          Requires Node.js 20+.

            npm install --omit=dev
            VIEX_PASSWORD='a-long-password' npm start

          Then open http://localhost:8787 (web viewer) and point VIEX Host / Viewer at this server.
          Put it behind HTTPS (Render, Caddy, nginx, Cloudflare Tunnel...) for use outside your LAN.
          Docs: https://github.com/itxahmaddev/viex/blob/main/docs/SETUP.md
          EOF
          (cd pkg && zip -qr ../out/viex-relay.zip viex-relay)
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: out/viex-relay.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, host, android, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: relay
          path: dist
      - uses: actions/download-artifact@v4
        with:
          path: host-dist
          pattern: "host-*"
      - name: Build latest.json for the auto-updater
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          platforms="{}"

          declare -A FILES=(
            [windows-x86_64]="host-dist/host-windows-x64/VIEX-Host-Setup.exe"
            [linux-x86_64]="host-dist/host-linux-x64/VIEX-Host-x86_64.AppImage"
            [darwin-aarch64]="host-dist/host-macos-arm64/VIEX-Host-arm64.app.tar.gz"
            [darwin-x86_64]="host-dist/host-macos-x64/VIEX-Host-x64.app.tar.gz"
          )
          for key in "${!FILES[@]}"; do
            file="${FILES[$key]}"
            sig_file="${file}.sig"
            if [ -f "$file" ] && [ -f "$sig_file" ]; then
              name="$(basename "$file")"
              sig="$(cat "$sig_file")"
              platforms=$(echo "$platforms" | jq --arg k "$key" --arg url "$BASE/$name" --arg sig "$sig" \
                '. + {($k): {url: $url, signature: $sig}}')
            else
              echo "No signed updater artifact for $key (set VIEX_UPDATER_PRIVATE_KEY to enable it) — skipping."
            fi
          done

          jq -n --arg version "$VERSION" --arg notes "VIEX v${VERSION}" --arg pub_date "$PUB_DATE" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > dist/latest.json
          cat dist/latest.json

          # Flatten the per-platform Host installers (and their .sig files) into dist/ too.
          find host-dist -mindepth 2 -maxdepth 2 -type f -exec cp {} dist/ \;
      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | File | What it is |
          |---|---|
          | **VIEX-Host-Setup.exe** | Windows installer |
          | **VIEX-Host-x86_64.AppImage** | Linux installer (also auto-updates) |
          | **VIEX-Host-amd64.deb** | Linux installer (Debian/Ubuntu, no auto-update) |
          | **VIEX-Host-arm64.dmg** / **VIEX-Host-x64.dmg** | macOS installer (Apple Silicon / Intel) |
          | **VIEX-Viewer.apk** | Android app — install on your phone to watch your PCs |
          | **viex-relay.zip** | Backend (Relay + web viewer) — or deploy to Render in one click |

          Setup guide: https://github.com/${{ github.repository }}/blob/main/docs/SETUP.md

          > Windows may show a SmartScreen notice, and macOS a Gatekeeper warning (this open-source build is not code-signed): on Windows, **More info → Run anyway**; on macOS, right-click the app → **Open**.
          > On Android, allow "Install unknown apps" for your browser/file manager first.
          > Once installed, the Windows and Linux Host builds check for and install updates automatically — no re-download needed.
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "VIEX v${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
