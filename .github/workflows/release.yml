name: Build & Release

# Every push to `main` builds the Windows Host installer, the Android Viewer APK and the
# Relay (backend) bundle, then publishes them as a new GitHub Release marked "Latest".
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/website.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  windows:
    name: Windows Host (.exe)
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/src-tauri
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - name: Build installer
        run: npm run tauri build -w host
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp host/src-tauri/target/release/bundle/nsis/*-setup.exe out/VIEX-Host-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/VIEX-Host-Setup.exe
          if-no-files-found: error

  android:
    name: Android Viewer (.apk)
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VIEX_VERSION: ${{ needs.version.outputs.version }}
      VIEX_VERSION_CODE: ${{ github.run_number }}
      # Optional: set these repository secrets to sign with your own key instead of the community keystore.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build -w viewer
      - name: Generate the Android project
        working-directory: viewer
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Use custom signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VIEX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VIEX_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VIEX_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "VIEX_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: viewer/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect
        run: |
          mkdir out
          cp viewer/android/app/build/outputs/apk/release/app-release.apk out/VIEX-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/VIEX-Viewer.apk
          if-no-files-found: error

  relay:
    name: Relay bundle (.zip)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w viewer
        env:
          VIEX_VERSION: ${{ needs.version.outputs.version }}
      - name: Package
        run: |
          mkdir -p pkg/viex-relay out
          cp -r relay/src pkg/viex-relay/src
          cp relay/package.json relay/.env.example pkg/viex-relay/
          cp -r viewer/dist pkg/viex-relay/public
          cat > pkg/viex-relay/README.txt <<'EOF'
          VIEX Relay (backend) + web viewer
          ---------------------------------
          Requires Node.js 20+.

            npm install --omit=dev
            VIEX_PASSWORD='a-long-password' npm start

          Then open http://localhost:8787 (web viewer) and point VIEX Host / Viewer at this server.
          Put it behind HTTPS (Render, Caddy, nginx, Cloudflare Tunnel...) for use outside your LAN.
          Docs: https://github.com/itxahmaddev/viex/blob/main/docs/SETUP.md
          EOF
          (cd pkg && zip -qr ../out/viex-relay.zip viex-relay)
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: out/viex-relay.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, windows, android, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | File | What it is |
          |---|---|
          | **VIEX-Host-Setup.exe** | Windows installer — install on every PC you want to watch |
          | **VIEX-Viewer.apk** | Android app — install on your phone to watch your PCs |
          | **viex-relay.zip** | Backend (Relay + web viewer) — or deploy to Render in one click |

          Setup guide: https://github.com/${{ github.repository }}/blob/main/docs/SETUP.md

          > Windows may show a SmartScreen notice (the open-source build is not code-signed): **More info → Run anyway**.
          > On Android, allow "Install unknown apps" for your browser/file manager first.
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "VIEX v${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
